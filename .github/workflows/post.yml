# Publishes a post to the Telegram channel with an inline "solve" button.
#
# Two ways to start it:
#   1. Manually: Actions -> "Post to Telegram channel" -> Run workflow -> folder name.
#   2. Automatically: add an empty file posts/<name>/publish and push it.
#      (To publish the same post again: delete the file, then add it again.)
#
# Needs repository secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN  - token of @chesskage_bot
#   TELEGRAM_CHANNEL    - channel username, e.g. @my_channel
#
# Each post lives in posts/<name>/ : text.txt (HTML allowed) + optional photo.jpg.
# <name> must match the puzzle id in src/puzzles.js, so the button opens that puzzle.

name: Post to Telegram channel

on:
  workflow_dispatch:
    inputs:
      post:
        description: 'Папка поста в posts/ (= id задачи, например opera)'
        required: true
      button:
        description: 'Текст кнопки'
        required: true
        default: '▶️ Решить задачу'
  push:
    branches: [main]
    paths:
      - 'posts/*/publish'

env:
  BOT_USERNAME: chesskage_bot
  APP_NAME: puzzles

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send post
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          EVENT: ${{ github.event_name }}
          INPUT_POST: ${{ inputs.post }}
          INPUT_BUTTON: ${{ inputs.button }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            scripts/post.sh "$INPUT_POST" "$INPUT_BUTTON"
            exit 0
          fi

          # Push: publish every folder whose "publish" file was newly added
          POSTS=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'posts/*/publish' | cut -d/ -f2 || true)
          if [ -z "$POSTS" ]; then
            echo "Новых флажков publish нет — ничего не публикую"
            exit 0
          fi
          for P in $POSTS; do
            scripts/post.sh "$P"
          done
